name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *' # daily: catches YouTube-side breakage early

permissions:
  contents: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx nuxt typecheck
      - run: npx nuxt build
      - name: Start server
        run: |
          PORT=3000 node .output/server/index.mjs > server.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:3000/ > /dev/null && break; sleep 1; done
      - name: Live API smoke test (YouTube Music, audio, lyrics)
        run: ./scripts/smoke.sh
      - name: End-to-end in Chrome (phone + desktop)
        run: node scripts/e2e.mjs
      - name: Lighthouse (mobile, throttled)
        if: always()
        run: |
          npx --yes lighthouse@12 http://localhost:3000/ --quiet --chrome-flags="--headless=new --no-sandbox" \
            --output=json --output=html --output-path=./e2e-shots/lighthouse-mobile || true
          npx --yes lighthouse@12 http://localhost:3000/ --quiet --preset=desktop --chrome-flags="--headless=new --no-sandbox" \
            --output=json --output-path=./e2e-shots/lighthouse-desktop.json || true
          node -e '
            const fs=require("fs");
            for (const f of ["e2e-shots/lighthouse-mobile.report.json","e2e-shots/lighthouse-desktop.json"]) {
              if (!fs.existsSync(f)) { console.log("missing", f); continue }
              const r=JSON.parse(fs.readFileSync(f)); const c=r.categories, a=r.audits
              console.log(f, Object.values(c).map(x=>x.title+": "+Math.round(x.score*100)).join(" · "))
              console.log("  FCP", a["first-contentful-paint"].displayValue, "· LCP", a["largest-contentful-paint"].displayValue,
                "· TBT", a["total-blocking-time"].displayValue, "· CLS", a["cumulative-layout-shift"].displayValue,
                "· SI", a["speed-index"].displayValue, "· JS", a["total-byte-weight"].displayValue)
              for (const [k,v] of Object.entries(a)) if (v.score!==null && v.score<0.9 && v.scoreDisplayMode!=="informative" && v.scoreDisplayMode!=="notApplicable" && v.scoreDisplayMode!=="manual") console.log("   -", k, v.score, v.displayValue??"")
            }'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-shots
          path: e2e-shots
      - name: Publish screenshots to the e2e-output branch
        if: always() && github.event_name != 'pull_request'
        run: |
          cp server.log e2e-shots/ 2>/dev/null || true
          cd e2e-shots && echo "${{ github.sha }} ${{ github.ref_name }}" > COMMIT
          git init -q && git checkout -q -b e2e-output
          git config user.name ci && git config user.email ci@users.noreply.github.com
          git add -A && git commit -qm "e2e ${{ github.sha }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" e2e-output
      - name: Server log
        if: always()
        run: tail -80 server.log
