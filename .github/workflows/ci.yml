name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *' # daily: catches YouTube-side breakage early

jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Client matrix (diagnostic)
        continue-on-error: true
        run: node scripts/clients.mjs 2>/dev/null | grep -v "^\[YOUTUBEJS" || true
      - name: PO token (diagnostic)
        continue-on-error: true
        run: node scripts/potoken.mjs 2>&1 | grep -v "^\[YOUTUBEJS" | grep -E "^PO|poToken|Error|error" | head -40 || true
      - run: npx nuxt build
      - name: Start server
        run: |
          PORT=3000 node .output/server/index.mjs > server.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:3000/ > /dev/null && break; sleep 1; done
      - name: Live smoke test (YouTube Music, audio, lyrics)
        run: ./scripts/smoke.sh
      - name: Server log
        if: always()
        run: cat server.log | tail -80
